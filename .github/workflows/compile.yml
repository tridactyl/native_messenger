name: compile

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '*'

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        # see https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Cache nimble
        id: cache-nimble
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-${{ runner.arch }}-nimble-v2-${{ hashFiles('*.nimble') }}
        if: runner.os != 'Windows'

      - uses: jiro4989/setup-nim-action@v2.3.0
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          sudo apt-get install gcc-arm-linux-gnueabihf
          nimble build -d:debug -Y --cpu:arm --passL:-static
          mv native_main native_main-armhf
          file native_main-armhf
        name: armhf build
        if: runner.os == 'Linux'

      - run: |
          sudo apt-get install gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu
          nimble build -d:debug -Y --cpu:arm64 --passL:-static
          mv native_main native_main-arm64
          file native_main-arm64
        name: arm64 build
        if: runner.os == 'Linux'

      - run: nimble build -d:debug -Y --verbose
        if: runner.os != 'Linux'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - run: nimble build -d:debug --verbose --passL:-static
        if: runner.os == 'Linux'

      - run: |
          mv native_main.exe native_main
        shell: bash
        if: runner.os == 'Windows'

      - run: |
          mv native_main native_main-x86
          nimble build --verbose -d:debug -Y --cpu:arm64 '--passC:"-target arm64-apple-macos11"' '--passL:"-target arm64-apple-macos11"'
          mv native_main native_main-arm64
          lipo -create -output native_main native_main-x86 native_main-arm64
        if: runner.os == 'macOS'

      - name: Test native messenger
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python test_native_main.py ./native_main
          else
            python3 test_native_main.py ./native_main
          fi

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native_main-${{ runner.os }}
          path: native_main

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: native_main-armhf-${{ runner.os }}
          path: native_main-armhf

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: native_main-arm64-${{ runner.os }}
          path: native_main-arm64

  test_macos_arm64:
    name: test (macos-15 arm64)
    needs: compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native_main-macOS
      - name: Test universal artifact natively
        run: |
          test "$(uname -m)" = arm64
          file native_main
          lipo -archs native_main
          chmod +x native_main
          python3 test_native_main.py ./native_main
