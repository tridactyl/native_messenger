name: release

on:
  push:
    tags: "*"

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        # see https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Cache nimble
        id: cache-nimble
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-${{ runner.arch }}-nimble-v2-${{ hashFiles('*.nimble') }}
        if: runner.os != 'Windows'

      - uses: jiro4989/setup-nim-action@v2.3.0
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          sudo apt-get install gcc-arm-linux-gnueabihf
          nimble build -d:release -d:danger --opt:speed -Y --cpu:arm --passL:-static
          mv native_main native_main-armhf
          file native_main-armhf
        name: armhf build
        if: runner.os == 'Linux'

      - run: |
          sudo apt-get install gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu
          nimble build -d:release -d:danger --opt:speed -Y --cpu:arm64 --passL:-static
          mv native_main native_main-arm64
          file native_main-arm64
        name: arm64 build
        if: runner.os == 'Linux'

      - run: nimble build -d:danger -d:release --opt:speed -Y --verbose
        if: runner.os != 'Linux'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - run: nimble build -d:danger -d:release --opt:speed -Y --verbose --passL:-static
        if: runner.os == 'Linux'

      - run: |
          mv native_main.exe native_main
        shell: bash
        if: runner.os == 'Windows'

      - run: |
          mv native_main native_main-x86
          nimble build --verbose -d:danger -d:release --opt:speed -Y --cpu:arm64 '--passC:"-target arm64-apple-macos11"' '--passL:"-target arm64-apple-macos11"'
          mv native_main native_main-arm64
          lipo -create -output native_main native_main-x86 native_main-arm64
        if: runner.os == 'macOS'

      - name: Test native messenger
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python test_native_main.py ./native_main
          else
            python3 test_native_main.py ./native_main
          fi

      - name: Stage release assets
        shell: bash
        run: |
          mkdir release
          cp native_main "release/native_main-${RUNNER_OS}"
          if [ "$RUNNER_OS" = Linux ]; then
            cp native_main-armhf "release/native_main-armhf-${RUNNER_OS}"
            cp native_main-arm64 "release/native_main-arm64-${RUNNER_OS}"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: release/
          if-no-files-found: error

  test_macos_arm64:
    name: test release (macos-15 arm64)
    needs: compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-macOS
          path: release
      - name: Test universal artifact natively
        run: |
          test "$(uname -m)" = arm64
          file release/native_main-macOS
          lipo -archs release/native_main-macOS
          chmod +x release/native_main-macOS
          python3 test_native_main.py release/native_main-macOS

  release:
    needs: [compile, test_macos_arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Release $GITHUB_REF_NAME" --notes-from-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
